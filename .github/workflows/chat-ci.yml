name: Chat CI

on:
  push:
    branches:
      - feature/discord-oauth-production
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          KEY_ENCRYPTION_SECRET: ci-placeholder-secret-32-characters-long
          NEXT_PUBLIC_SITE_URL: https://chat.mindlarp.example
